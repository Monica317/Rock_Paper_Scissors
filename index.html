<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
     <h1>Rock Paper Scissors Game</h1>
     <div class="choices">
       <div class="choice" id="rock">
         <img src="https://uploads.onecompiler.io/449g68tbk/44cdz82sa/rock2.png">
       </div>
        <div class="choice" id="paper">
          <img src="https://uploads.onecompiler.io/449g68tbk/44cdz82sa/paper2.png">
        </div>
         <div class="choice" id="scissors">
           <img src="https://uploads.onecompiler.io/449g68tbk/44cdz82sa/scissors.jpg">
         </div>
     </div>
     <div class ="score-board">
       <div class ="score">
         <p id="user">0</p>
         <p>You</p>
       </div>
       <div class ="score">
         <p id="comp">0</p>
         <p>Computer</p>
       </div>
     </div>
     <div class="msg-container">
       <p id="msg">
         Play your move
       </p>
     </div>
      <script src="script.js"></script>
  </body>
</html>
